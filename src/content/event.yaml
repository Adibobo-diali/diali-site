questions:
  - title: What does it take to get to the top, and stay there?
    text: Talent opens the door, but mindset keeps you in the room. What habits and thinking do top players share, and can they be learned young?
    star: [0.411, 0.185]
  - title: What happens when you're told no?
    text: Most young players face rejection, release or injury, and few are prepared for it. How do you bounce back, and how can parents help?
    star: [0.302, 0.426]
  - title: Who looks after the mind?
    text: Young players train their bodies every day, but who trains and protects their mental health? What signs should parents and coaches watch for?
    star: [0.404, 0.380]
  - title: What is social media doing to your game?
    text: Highlight reels, comparison and online criticism follow young players everywhere. How do they protect their focus and their confidence?
    star: [0.500, 0.407]
