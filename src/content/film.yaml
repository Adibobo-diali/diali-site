# Homepage film timeline (free version 5.2). vh = scroll length on desktop, vhMobile on phones.
# Swap in the continuous take (5.3) later by changing `version` and the beats; no code changes.
version: continuous-5.3
# Continuous take (5.4): frame atlases drawn on a canvas (smooth both ways), cut from the clips by
# scripts/build-frames.sh. Segment lengths are in seconds, in film order. Lite mode keeps the stills.
clip:
  desktop: /film/home/desktop
  mobile: /film/home/mobile
  frames: 962
  fps: 12
  cols: 3
  rows: 2
  poster_desktop: /film/home-poster-desktop.jpg
  poster_mobile: /film/home-poster-mobile.jpg
  version: "20261107b"
  segments:
    - { id: runout,     d: 4.208 }
    - { id: tunnel,     d: 8.000 }
    - { id: hub,        d: 6.583 }
    - { id: workshop,   d: 6.583 }
    - { id: workshopO,  d: 5.167 }
    - { id: tournaments, d: 6.583 }
    - { id: tournamentsO, d: 5.167 }
    - { id: scouting,   d: 6.583 }
    - { id: scoutingO,  d: 5.167 }
    - { id: conferences, d: 8.000 }
    - { id: team,       d: 10.125 }
    - { id: ending,     d: 8.000 }
# Conference page continuous take: doors into the hall, push to the spotlit chair, back out,
# doors close, then pull back out of the number 20 to the penalty taker (the FC 27 bridge).
conf_clip:
  desktop: /film/conf/desktop
  mobile: /film/conf/mobile
  frames: 412
  fps: 12
  cols: 3
  rows: 2
  version: "20261107b"
  segments:
    - { id: enter, d: 8.000 }
    - { id: push,  d: 6.583 }
    - { id: back,  d: 6.583 }
    - { id: close, d: 5.167 }
    - { id: twenty, d: 8.000 }
hub:
  image: film/home_03_four_tunnels_hub
  aspect: 2.356
  tunnels:
    workshop:    { x: 0.215, y: 0.545, w: 0.040, h: 0.064, href: /events/spot-the-spark, label: Workshop }
    tournaments: { x: 0.418, y: 0.537, w: 0.038, h: 0.052, href: /fc27, label: Tournament }
    scouting:    { x: 0.584, y: 0.537, w: 0.034, h: 0.052, href: /our-programs#scouting, label: Scouting }
    conferences: { x: 0.783, y: 0.547, w: 0.040, h: 0.064, href: /the-mind-behind-the-game, label: Conference }
frames:
  walkout: { desktop: /frames/desktop/walkout, mobile: /frames/mobile/walkout, count: 101, fps: 20, version: "20261106" }
beats:
# Paced for reading in flicks: each text beat holds its words fully visible for about 75vh
# (5 normal wheel flicks), phones included. Checked with scratch flick test 120/240/360 px.
  - { id: breathe,     vh: 80,  vhMobile: 80 }
  - { id: runout,      vh: 140, vhMobile: 120 }
  - { id: hub,         vh: 120, vhMobile: 120 }
  - { id: workshop,    vh: 170, vhMobile: 170, photo: photos/spot-the-spark-room }
  - { id: spin1,       vh: 50,  vhMobile: 40 }
  - { id: tournaments, vh: 170, vhMobile: 170, photo: photos/dream-big-ii-group }
  - { id: spin2,       vh: 50,  vhMobile: 40 }
  - { id: scouting,    vh: 170, vhMobile: 170, photo: photos/scouting-cultural-leonesa }
  - { id: spin3,       vh: 50,  vhMobile: 40 }
  - { id: conferences, vh: 170, vhMobile: 170 }
  - { id: spinback,    vh: 115, vhMobile: 115 }
  - { id: team,        vh: 220, vhMobile: 200 }
  - { id: ending,      vh: 180, vhMobile: 160 }
