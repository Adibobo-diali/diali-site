  aspect: 2.356
  tunnels:
    workshop:    { x: 0.215, y: 0.545, w: 0.040, h: 0.064, href: /events/spot-the-spark, label: Workshop }
    tournaments: { x: 0.418, y: 0.537, w: 0.038, h: 0.052, href: /fc27, label: Tournament }
    scouting:    { x: 0.584, y: 0.537, w: 0.034, h: 0.052, href: /our-programs#scouting, label: Scouting }
    conferences: { x: 0.783, y: 0.547, w: 0.040, h: 0.064, href: /the-mind-behind-the-game, label: Conference }
frames:
  walkout: { desktop: /frames/desktop/walkout, mobile: /frames/mobile/walkout, count: 101, fps: 20, version: "20261106" }
beats:
