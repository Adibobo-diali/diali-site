# Homepage film timeline (free version 5.2). vh = scroll length on desktop, vhMobile on phones.
# Swap in the continuous take (5.3) later by changing `version` and the beats; no code changes.
version: continuous-5.3
# Continuous take (5.3): one scroll-scrubbed video, cut from the Higgsfield clips by scripts/encode-film.sh.
# Segment lengths are in seconds, in the order they sit in the video. Lite mode keeps the stills.
clip:
  desktop: /film/home-desktop.mp4
  mobile: /film/home-mobile.mp4
  version: "20261107"
  segments:
    - { id: tunnel,     d: 8.000 }
    - { id: hub,        d: 6.583 }
    - { id: workshop,   d: 6.583 }
    - { id: workshopO,  d: 5.167 }
    - { id: tournaments, d: 6.583 }
    - { id: tournamentsO, d: 5.167 }
    - { id: scouting,   d: 6.583 }
    - { id: scoutingO,  d: 5.167 }
    - { id: conferences, d: 8.000 }
    - { id: team,       d: 10.125 }
    - { id: ending,     d: 8.000 }
# Conference page continuous take: doors into the hall, push to the spotlit chair, back out,
# doors close, then pull back out of the number 20 to the penalty taker (the FC 27 bridge).
conf_clip:
  desktop: /film/conf-desktop.mp4
  mobile: /film/conf-mobile.mp4
  version: "20261107"
  segments:
    - { id: enter, d: 8.000 }
    - { id: push,  d: 6.583 }
    - { id: back,  d: 6.583 }
    - { id: close, d: 5.167 }
    - { id: twenty, d: 8.000 }
hub:
